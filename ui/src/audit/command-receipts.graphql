query AuditCommandReceipts(
  $first: Int
  $after: String
  $status: CommandReceiptStatus
  $toolName: String
  $sort: LatestUpdateSort
) {
  commandReceipts(first: $first, after: $after, status: $status, toolName: $toolName, sort: $sort) {
    nodes {
      commandId
      toolName
      status
      summary
      receipt
      completedAt
      warnings
      nextActionTools
      emittedEvents { id type streamContext streamName streamId streamRevision }
    }
    pageInfo { endCursor hasNextPage }
  }
}

query AuditCommandReceipt($commandId: ID!) {
  commandReceipt(commandId: $commandId) {
    commandId
    toolName
    status
    summary
    receipt
    completedAt
    warnings
    nextActionTools
    emittedEvents { id type streamContext streamName streamId streamRevision }
  }
}
