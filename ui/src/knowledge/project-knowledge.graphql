fragment SkillSummaryFields on SkillSummary {
  id
  name
  scope
  revision
  description
  assetCount
  contentDigest
  publishedAt
}

fragment ArtifactSummaryFields on DevelopmentArtifactSummary {
  id
  observationId
  scope
  title
  kind
  labels
  mediaType
  encoding
  contentDigest
  byteSize
  classificationRevision
  classificationReason
  relationshipCount
  capturedAt
  observedAt
  classifiedAt
  source {
    kind
    locator
    revision
    observedAt
    collector
  }
}

query ProjectSkills($projectRef: ID!, $first: Int, $name: String, $after: String) {
  projectSkills(projectRef: $projectRef, first: $first, name: $name, after: $after) {
    nodes { ...SkillSummaryFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectSkill($projectRef: ID!, $name: String!) {
  projectSkill(projectRef: $projectRef, name: $name) {
    skill {
      id
      name
      scope
      revision
      description
      instructions
      contentDigest
      publishedAt
      assets { path mediaType executable contentDigest byteSize }
    }
  }
}

query ProjectSkillAsset($projectRef: ID!, $name: String!, $path: String!) {
  projectSkillAsset(projectRef: $projectRef, name: $name, path: $path) {
    asset { path revision encoding mediaType executable text base64 contentDigest byteSize }
  }
}

query ProjectArtifacts(
  $projectRef: ID!
  $first: Int
  $kind: DevelopmentArtifactKind
  $labels: [String!]
  $sourceKind: DevelopmentArtifactSourceKind
  $after: String
) {
  projectArtifacts(
    projectRef: $projectRef
    first: $first
    kind: $kind
    labels: $labels
    sourceKind: $sourceKind
    after: $after
  ) {
    nodes { ...ArtifactSummaryFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectArtifact($projectRef: ID!, $artifactId: ID!) {
  projectArtifact(projectRef: $projectRef, artifactId: $artifactId) {
    artifact { ...ArtifactSummaryFields }
    content { encoding mediaType text base64 contentDigest byteSize }
  }
}

query ProjectArtifactRelationships(
  $projectRef: ID!
  $artifactId: ID!
  $first: Int
  $direction: ArtifactRelationDirection
  $relation: DevelopmentArtifactRelationKind
  $after: String
) {
  projectArtifactRelationships(
    projectRef: $projectRef
    artifactId: $artifactId
    first: $first
    direction: $direction
    relation: $relation
    after: $after
  ) {
    artifact { ...ArtifactSummaryFields }
    relationships {
      nodes {
        id
        direction
        relation
        displayRelation
        peerKind
        peerId
        status
        targetStatus
        targetName
        targetScope
        path
        fragment
        normalizedLocator
        declaredAt
        peerArtifact { ...ArtifactSummaryFields }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}
