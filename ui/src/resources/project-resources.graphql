fragment ProjectResourceFields on ProjectResource {
  id
  repositoryId
  kind
  path
  lifecycleStatus
  unbindingReason
  registeredEventId
  registeredActorId
  registeredAt
  latestTransitionEventId
  latestTransitionActorId
  lastTransitionAt
}

fragment ResourceWorkIntentionFields on ResourceWorkIntention {
  id
  intentionSetId
  resourceId
  repositoryId
  resourceKind
  resourcePath
  resourceLifecycleStatus
  status
  baseBlobOid
  mode
  purpose
  context
  fencingToken
  policyVersion
  changeSetId
  workItemId
  attemptId
  agentId
  declaredEventId
  lastExpandedEventId
  lastRenewedEventId
  withdrawalEventId
  attemptTerminalEventId
  declaredAt
  lastExpandedAt
  lastRenewedAt
  previousExpiresAt
  expiresAt
  withdrawnAt
  attemptTerminalAt
  updatedAt
}

query ProjectResources(
  $projectRef: ID!
  $first: Int
  $after: String
  $path: String
  $resourceKind: ResourceKind
  $resourceLifecycleStatus: ResourceLifecycleStatus
  $sort: LatestUpdateSort
) {
  projectResources(
    projectRef: $projectRef
    first: $first
    after: $after
    path: $path
    resourceKind: $resourceKind
    resourceLifecycleStatus: $resourceLifecycleStatus
    sort: $sort
  ) {
    nodes { ...ProjectResourceFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectResource($projectRef: ID!, $resourceId: ID!) {
  projectResource(projectRef: $projectRef, resourceId: $resourceId) {
    ...ProjectResourceFields
  }
}

query ProjectActiveResourceWorkIntentions(
  $projectRef: ID!
  $first: Int
  $after: String
  $agentId: String
  $changeSetId: ID
  $workItemId: ID
  $attemptId: ID
  $mode: ResourceWorkIntentionMode
  $sort: LatestUpdateSort
) {
  projectActiveResourceWorkIntentions(
    projectRef: $projectRef
    first: $first
    after: $after
    agentId: $agentId
    changeSetId: $changeSetId
    workItemId: $workItemId
    attemptId: $attemptId
    mode: $mode
    sort: $sort
  ) {
    asOf
    nodes { ...ResourceWorkIntentionFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectResourceWorkIntention($projectRef: ID!, $intentionId: ID!) {
  projectResourceWorkIntention(projectRef: $projectRef, intentionId: $intentionId) {
    ...ResourceWorkIntentionFields
  }
}
