fragment ProjectResourceFields on ProjectResource {
  id
  repositoryId
  kind
  path
  lifecycleStatus
  unbindingReason
  registeredEventId
  registeredActorId
  registeredAt
  latestTransitionEventId
  latestTransitionActorId
  lastTransitionAt
}

fragment ResourceLeaseFields on ResourceLease {
  id
  leaseSetId
  resourceId
  repositoryId
  resourceKind
  resourcePath
  resourceLifecycleStatus
  status
  baseBlobOid
  fencingToken
  policyVersion
  changeSetId
  workItemId
  attemptId
  agentId
  reservedEventId
  lastExpandedEventId
  lastRenewedEventId
  releaseEventId
  attemptTerminalEventId
  reservedAt
  lastExpandedAt
  lastRenewedAt
  previousExpiresAt
  expiresAt
  releasedAt
  attemptTerminalAt
  lastProjectedAt
}

query ProjectResources(
  $projectRef: ID!
  $first: Int
  $after: String
  $path: String
  $resourceKind: ResourceKind
  $resourceLifecycleStatus: ResourceLifecycleStatus
) {
  projectResources(
    projectRef: $projectRef
    first: $first
    after: $after
    path: $path
    resourceKind: $resourceKind
    resourceLifecycleStatus: $resourceLifecycleStatus
  ) {
    nodes { ...ProjectResourceFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectResource($projectRef: ID!, $resourceId: ID!) {
  projectResource(projectRef: $projectRef, resourceId: $resourceId) {
    ...ProjectResourceFields
  }
}

query ProjectActiveResourceLeases(
  $projectRef: ID!
  $first: Int
  $after: String
  $agentId: String
  $changeSetId: ID
  $workItemId: ID
  $attemptId: ID
) {
  projectActiveResourceLeases(
    projectRef: $projectRef
    first: $first
    after: $after
    agentId: $agentId
    changeSetId: $changeSetId
    workItemId: $workItemId
    attemptId: $attemptId
  ) {
    asOf
    nodes { ...ResourceLeaseFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectResourceLease($projectRef: ID!, $leaseId: ID!) {
  projectResourceLease(projectRef: $projectRef, leaseId: $leaseId) {
    ...ResourceLeaseFields
  }
}
