fragment CoordinationChangeSetFields on CoordinationChangeSet {
  id
  goal
  acceptanceCriteria
  domainStatus
  workItemCount
  runningWorkItemCount
  openWorkItemCount
  lastProcessedAt
}

fragment CoordinationWorkItemFields on CoordinationWorkItem {
  id
  changeSetId
  repositoryId
  goal
  acceptanceCriteria
  competitiveMode
  domainStatus
  presentationStatus
  activeAttemptId
  activeAgentId
  attemptStatus
  attemptAuthorizedAt
  attemptStartedAt
  attemptTerminalAt
  createdAt
  madeReadyAt
  acquiredAt
  completedAt
  lastProcessedAt
}

fragment CoordinationDependencyFields on CoordinationDependency {
  id
  producerWorkItemId
  consumerWorkItemId
  producerRepositoryId
  consumerRepositoryId
  dependencyKind
  requiredOutput { kind key }
  blocking
  declaredAt
  satisfiedAt
  lastProcessedAt
}

query ProjectChangeSets(
  $projectRef: ID!
  $first: Int
  $after: String
  $status: CoordinationChangeSetStatus
  $sort: LatestUpdateSort
) {
  projectChangeSets(projectRef: $projectRef, first: $first, after: $after, status: $status, sort: $sort) {
    nodes { ...CoordinationChangeSetFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectChangeSet($projectRef: ID!, $changeSetId: ID!) {
  projectChangeSet(projectRef: $projectRef, changeSetId: $changeSetId) {
    ...CoordinationChangeSetFields
  }
}

query ProjectWorkItems(
  $projectRef: ID!
  $first: Int
  $after: String
  $presentationStatuses: [CoordinationPresentationStatus!]
  $sort: WorkItemSort
  $changeSetId: ID
  $agentId: String
) {
  projectWorkItems(
    projectRef: $projectRef
    first: $first
    after: $after
    presentationStatuses: $presentationStatuses
    sort: $sort
    changeSetId: $changeSetId
    agentId: $agentId
  ) {
    nodes { ...CoordinationWorkItemFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectWorkItem($projectRef: ID!, $workItemId: ID!) {
  projectWorkItem(projectRef: $projectRef, workItemId: $workItemId) {
    workItem { ...CoordinationWorkItemFields }
    attempt {
      id
      agentId
      status
      selectedCandidateId
      abandonmentReason
      authorizedAt
      startedAt
      terminalAt
      baseSnapshots { repositoryId objectFormat commitOid }
    }
    checkpoint {
      id
      checkpointKind
      targetBranch
      headCommitOid
      manifestDigest
      evidenceStatus
      submittedAt
    }
  }
}

query ProjectDependencies($projectRef: ID!, $first: Int, $after: String, $blocking: Boolean, $sort: LatestUpdateSort) {
  projectDependencies(projectRef: $projectRef, first: $first, after: $after, blocking: $blocking, sort: $sort) {
    nodes { ...CoordinationDependencyFields }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectDependency($projectRef: ID!, $dependencyId: ID!) {
  projectDependency(projectRef: $projectRef, dependencyId: $dependencyId) {
    ...CoordinationDependencyFields
  }
}
