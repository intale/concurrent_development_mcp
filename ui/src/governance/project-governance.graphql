fragment GovernanceDecisionSummary on GovernanceDecision {
  id
  topicId
  policyStatus
  statementKind
  effect
  modality
  recordedAt
  currentAt
  correctionCount
  scope { repositoryIds changeSetId workItemId attemptId candidateId }
  value { schema name items targetKind targetId action }
}

fragment GovernanceGuidanceSummary on ProjectGuidance {
  id
  conversationId
  excerpt
  source
  policyStatus
  recordedAt
  actor { kind id }
  anchors { repositoryIds changeSetId workItemId attemptId }
}

fragment GovernanceChoiceSummary on GovernanceAgentChoice {
  id
  choiceType
  observationStatus
  reasonSummary
  recordedAt
  selected { id summary }
  context { repositoryId changeSetId workItemId attemptId phase language paths environment agentRole }
}

fragment GovernanceImpactSummary on AgentChoiceImpact {
  assessmentId
  choiceId
  attemptId
  outcome
  reason
  policyVersion
  decisionId
  decisionChangeKind
  decisionChangedAt
  beforeStatus
  beforeBasis
  beforeReasonCodes
  afterStatus
  afterBasis
  afterReasonCodes
  assessedAt
}

query ProjectGovernanceDecisions(
  $projectRef: ID!
  $first: Int
  $topicId: String
  $policyStatus: DecisionPolicyStatus
  $after: String
) {
  projectDecisions(
    projectRef: $projectRef
    first: $first
    topicId: $topicId
    policyStatus: $policyStatus
    after: $after
  ) {
    nodes { ...GovernanceDecisionSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectGovernanceGuidanceMessages(
  $projectRef: ID!
  $first: Int
  $source: GuidanceSource
  $after: String
) {
  projectGuidanceMessages(projectRef: $projectRef, first: $first, source: $source, after: $after) {
    nodes { ...GovernanceGuidanceSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectGovernanceAgentChoices(
  $projectRef: ID!
  $first: Int
  $choiceType: AgentChoiceKind
  $status: AgentChoiceStatus
  $after: String
) {
  projectAgentChoices(
    projectRef: $projectRef
    first: $first
    choiceType: $choiceType
    status: $status
    after: $after
  ) {
    nodes { ...GovernanceChoiceSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectGovernanceDecisionImpacts(
  $projectRef: ID!
  $first: Int
  $outcome: AgentChoiceImpactOutcome
  $after: String
) {
  projectDecisionImpacts(projectRef: $projectRef, first: $first, outcome: $outcome, after: $after) {
    nodes { ...GovernanceImpactSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectGovernanceDecision($projectRef: ID!, $decisionId: ID!) {
  projectDecision(projectRef: $projectRef, decisionId: $decisionId) {
    membershipBases
    decision {
      ...GovernanceDecisionSummary
      interpretationId
      sourceMessageId
      definitionDigest
      rationaleSummary
      correctionSummary
      scope {
        repositoryIds
        changeSetId
        workItemId
        attemptId
        candidateId
        workspaceId
        pathSelectors
        symbolSelectors
        contractSelectors
        schemaSelectors
        branchSelectors
        environments
        agentRoles
      }
      conditions { phases languages tags repositoryKinds artifactKinds environments }
      authority { actorId role }
      enforcement { level retroactivity onViolation }
      recordedBy { kind id }
      currentBy { kind id }
      currentEvent { id type streamContext streamName streamId streamRevision }
    }
  }
}

query ProjectGovernanceGuidance(
  $projectRef: ID!
  $messageId: ID!
  $interpretationsFirst: Int
  $interpretationsAfter: String
) {
  projectGuidance(
    projectRef: $projectRef
    messageId: $messageId
    interpretationsFirst: $interpretationsFirst
    interpretationsAfter: $interpretationsAfter
  ) {
    guidance {
      id
      conversationId
      text
      source
      policyStatus
      recordedAt
      actor { kind id }
      anchors { repositoryIds changeSetId workItemId attemptId }
    }
    interpretations {
      nodes {
        id
        messageId
        lifecycleStatus
        policyStatus
        statementKind
        topicId
        effect
        modality
        sourceSpanText
        assessmentStatus
        assessmentReasons
        clarificationRequiredAt
        clarificationQuestions { field prompt options }
        proposedAt
        actor { kind id }
        value { schema name items targetKind targetId action }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

query ProjectGovernanceAgentChoice(
  $projectRef: ID!
  $choiceId: ID!
  $impactsFirst: Int
  $impactsAfter: String
) {
  projectAgentChoice(
    projectRef: $projectRef
    choiceId: $choiceId
    impactsFirst: $impactsFirst
    impactsAfter: $impactsAfter
  ) {
    choice {
      ...GovernanceChoiceSummary
      acceptedAt
      invalidatedAt
      invalidationReason
      assessmentBasis
      assessmentDecisionIds
      assessmentWarnings
      alternatives { id summary }
      recordedBy { kind id }
      acceptedBy { kind id }
    }
    impacts {
      nodes { ...GovernanceImpactSummary }
      pageInfo { endCursor hasNextPage }
    }
  }
}

query ProjectGovernanceDecisionImpact($projectRef: ID!, $assessmentId: ID!) {
  projectDecisionImpact(projectRef: $projectRef, assessmentId: $assessmentId) {
    impact { ...GovernanceImpactSummary }
  }
}
