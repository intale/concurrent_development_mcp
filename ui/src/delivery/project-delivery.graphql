fragment DeliveryCandidateSummary on CandidateCheckpoint {
  id
  changeSetId
  workItemId
  attemptId
  repositoryId
  targetBranch
  baseCommitOid
  headCommitOid
  checkpointKind
  evidenceStatus
  manifestDigest
  buildContextDigest
  manifestObserved
  buildContextObserved
  submittedAt
}

fragment DeliveryObligationSummary on DeliveryVerificationObligation {
  id
  kind
  status
  changeSetId
  sourceCandidateId
  targetCandidateId
  sourceRepositoryId
  targetRepositoryId
  enforcement
  claimantId
  claimExpiresAt
  evidenceCount
  passedEvidenceKinds
  missingEvidenceKinds
  createdAt
}

fragment DeliveryMergeSummary on DeliveryMergeSnapshot {
  id
  repositoryId
  targetBranch
  targetBaseCommitOid
  mergeCommitOid
  candidateCount
  verificationStatus
  evidenceStatus
  producedAt
}

fragment DeliveryReleaseSummary on DeliveryReleaseSet {
  id
  changeSetId
  repositoryIds
  memberCount
  status
  verificationStatus
  releaseDigest
  preparedAt
}

query ProjectDeliveryCandidates(
  $projectRef: ID!
  $first: Int
  $sort: DeliverySort
  $changeSetId: ID
  $checkpointKind: CandidateCheckpointKind
  $after: String
) {
  projectCandidateCheckpoints(
    projectRef: $projectRef
    first: $first
    sort: $sort
    changeSetId: $changeSetId
    checkpointKind: $checkpointKind
    after: $after
  ) {
    nodes { ...DeliveryCandidateSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectDeliveryObligations(
  $projectRef: ID!
  $first: Int
  $sort: DeliverySort
  $changeSetId: ID
  $status: VerificationObligationStatus
  $after: String
) {
  projectVerificationObligations(
    projectRef: $projectRef
    first: $first
    sort: $sort
    changeSetId: $changeSetId
    status: $status
    after: $after
  ) {
    nodes { ...DeliveryObligationSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectDeliveryMerges($projectRef: ID!, $first: Int, $sort: DeliverySort, $after: String) {
  projectMergeSnapshots(projectRef: $projectRef, first: $first, sort: $sort, after: $after) {
    nodes { ...DeliveryMergeSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectDeliveryReleases(
  $projectRef: ID!
  $first: Int
  $sort: DeliverySort
  $changeSetId: ID
  $status: ReleaseSetStatus
  $after: String
) {
  projectReleaseSets(
    projectRef: $projectRef
    first: $first
    sort: $sort
    changeSetId: $changeSetId
    status: $status
    after: $after
  ) {
    nodes { ...DeliveryReleaseSummary }
    pageInfo { endCursor hasNextPage }
  }
}

query ProjectDeliveryCandidate(
  $projectRef: ID!
  $candidateId: ID!
  $direction: CandidateImpactDirection
  $first: Int
  $impactsAfter: String
) {
  projectCandidateCheckpoint(
    projectRef: $projectRef
    candidateId: $candidateId
    direction: $direction
    first: $first
    impactsAfter: $impactsAfter
  ) {
    checkpoint { ...DeliveryCandidateSummary }
    impactDirection
    impactSurfaceDigest
    impactRelationships {
      nodes {
        counterpart { ...DeliveryCandidateSummary }
        relationshipKind
        reasons { kind matches }
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

query ProjectDeliveryVerification(
  $projectRef: ID!
  $obligationId: ID!
  $evidenceFirst: Int
  $evidenceAfter: String
) {
  projectVerificationObligation(
    projectRef: $projectRef
    obligationId: $obligationId
    evidenceFirst: $evidenceFirst
    evidenceAfter: $evidenceAfter
  ) {
    obligation { ...DeliveryObligationSummary }
    requiredEvidence
    reasons { kind matches }
    evidence {
      nodes {
        id
        evidenceKind
        conclusion
        assessmentInputDigest
        resultDigest
        producedAt
        submittedAt
        globalPosition
      }
      pageInfo { endCursor hasNextPage }
    }
  }
}

query ProjectDeliveryMerge(
  $projectRef: ID!
  $mergeSnapshotId: ID!
  $authorizationsFirst: Int
  $authorizationsAfter: String
) {
  projectMergeSnapshot(
    projectRef: $projectRef
    mergeSnapshotId: $mergeSnapshotId
    authorizationsFirst: $authorizationsFirst
    authorizationsAfter: $authorizationsAfter
  ) {
    snapshot { ...DeliveryMergeSummary }
    candidates { id changeSetId workItemId attemptId baseCommitOid headCommitOid manifestDigest }
    authorizations {
      nodes { id mergeSnapshotId outcome policyVersion inputDigest decisionDigest reasonCount decidedAt }
      pageInfo { endCursor hasNextPage }
    }
  }
}

query ProjectDeliveryRelease($projectRef: ID!, $releaseSetId: ID!) {
  projectReleaseSet(projectRef: $projectRef, releaseSetId: $releaseSetId) {
    releaseSet { ...DeliveryReleaseSummary }
    members {
      position
      repositoryId
      mergeSnapshotId
      orderedCandidateIds
    }
    integrations { repositoryId attemptId attemptNumber outcome failureCode recordedAt }
    verificationAttemptCount
    activated
    compensationRequested
    completionOutcome
  }
}
