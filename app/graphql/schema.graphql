"""
Read-only access to the latest available coordination projections.
"""
type Query {
  """
  One command-completion audit fact.
  """
  commandReceipt(commandId: ID!): CommandReceipt

  """
  Global command-completion audit facts without inferred project attribution.
  """
  commandReceipts(after: String, first: Int = 20, status: CommandReceiptStatus, toolName: String): CommandReceiptConnection!

  """
  One project AgentChoice and its bounded decision-impact assessments.
  """
  projectAgentChoice(choiceId: ID!, impactsAfter: String, impactsFirst: Int = 20, repositoryId: ID!): ProjectAgentChoice

  """
  One project-scoped Artifact with passive content and active relationships.
  """
  projectArtifact(artifactId: ID!, direction: ArtifactRelationDirection = BOTH, first: Int = 20, relation: DevelopmentArtifactRelationKind, relationsAfter: String, repositoryId: ID!): ProjectArtifact

  """
  Latest available coordination facts for one registered project.
  """
  projectCoordination(blocking: Boolean, changeSetsAfter: String, dependenciesAfter: String, first: Int = 20, presentationStatuses: [CoordinationPresentationStatus!], repositoryId: ID!, workItemSort: WorkItemSort = WORK_ITEM_ID_ASC, workItemsAfter: String): ProjectCoordination

  """
  One Decision deterministically associated with the exact project.
  """
  projectDecision(decisionId: ID!, repositoryId: ID!): ProjectDecision

  """
  Project-scoped Decisions, guidance, AgentChoices, and decision impacts.
  """
  projectGovernance(afterChoice: String, afterDecision: String, afterGuidance: String, afterImpact: String, choiceStatus: AgentChoiceStatus, choiceType: AgentChoiceKind, decisionPolicyStatus: DecisionPolicyStatus, decisionTopicId: String, first: Int = 20, guidanceSource: GuidanceSource, impactOutcome: AgentChoiceImpactOutcome, repositoryId: ID!): ProjectGovernance

  """
  One project-scoped guidance fact and its bounded interpretation proposals.
  """
  projectGuidance(interpretationsAfter: String, interpretationsFirst: Int = 20, messageId: ID!, repositoryId: ID!): ProjectGuidanceDetail

  """
  Current Skills and Development Artifacts for one registered project.
  """
  projectKnowledge(artifactKind: DevelopmentArtifactKind, artifactLabels: [String!], artifactSourceKind: DevelopmentArtifactSourceKind, artifactsAfter: String, first: Int = 20, repositoryId: ID!, skillName: String, skillsAfter: String): ProjectKnowledge

  """
  Latest available resource inventory and factual active leases for one project.
  """
  projectResources(activeLeasesAfter: String, first: Int = 20, repositoryId: ID!, resourceKind: ResourceKind, resourceLifecycleStatus: ResourceLifecycleStatus, resourcesAfter: String): ProjectResources

  """
  Current projected revision of one Skill in a project's exact scope.
  """
  projectSkill(name: String!, repositoryId: ID!): ProjectSkill

  """
  Current projected content of one Skill asset in a project's exact scope.
  """
  projectSkillAsset(name: String!, path: String!, repositoryId: ID!): ProjectSkillAsset

  """
  List projects in one exact caller-chosen scope in stable Repository-ID order.
  """
  projects(after: String, first: Int = 20, scope: String!): ProjectConnection!
}

