"""
Read-only access to the latest available coordination projections.
"""
type Query {
  """
  One command-completion audit fact.
  """
  commandReceipt(commandId: ID!): CommandReceipt

  """
  Global command-completion audit facts without inferred project attribution.
  """
  commandReceipts(after: String, first: Int = 20, sort: LatestUpdateSort = NEWEST_FIRST, status: CommandReceiptStatus, toolName: String): CommandReceiptConnection!

  """
  One global operation batch with bounded typed item outcomes.
  """
  operationBatch(batchId: ID!, first: Int = 50, itemsAfter: String): OperationBatchDetail

  """
  Global operation-batch progress without inferred project attribution.
  """
  operationBatches(after: String, first: Int = 20, sort: DeliverySort = NEWEST_FIRST, status: OperationBatchStatus, targetTool: OperationBatchTool): OperationBatchConnection!

  """
  Resolve one server-issued Project reference to its exact scope and Repository members.
  """
  project(projectRef: ID!, repositoriesAfter: String, repositoriesFirst: Int = 20): ProjectOverview

  """
  Page active advisory Resource work intentions for the exact Project scope.
  """
  projectActiveResourceWorkIntentions(after: String, agentId: String, attemptId: ID, changeSetId: ID, first: Int = 20, mode: ResourceWorkIntentionMode, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, workItemId: ID): ResourceWorkIntentionConnection

  """
  One project AgentChoice and its bounded decision-impact assessments.
  """
  projectAgentChoice(choiceId: ID!, impactsAfter: String, impactsFirst: Int = 20, projectRef: ID!): ProjectAgentChoice

  """
  Page AgentChoices associated with any Repository member of the exact Project scope.
  """
  projectAgentChoices(after: String, choiceType: AgentChoiceKind, first: Int = 20, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, status: AgentChoiceStatus): AgentChoiceConnection

  """
  One Project-scoped Artifact with its passive projected content.
  """
  projectArtifact(artifactId: ID!, projectRef: ID!): ProjectArtifact

  """
  Page active semantic relationships for one Project-scoped Artifact.
  """
  projectArtifactRelationships(after: String, artifactId: ID!, direction: ArtifactRelationDirection = BOTH, first: Int = 20, projectRef: ID!, relation: DevelopmentArtifactRelationKind): ProjectArtifactRelationships

  """
  Page current Development Artifacts shared by the exact Project scope.
  """
  projectArtifacts(after: String, first: Int = 20, kind: DevelopmentArtifactKind, labels: [String!], projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, sourceKind: DevelopmentArtifactSourceKind): DevelopmentArtifactConnection

  """
  One project Candidate checkpoint and one bounded semantic impact direction.
  """
  projectCandidateCheckpoint(candidateId: ID!, direction: CandidateImpactDirection = OUTGOING, first: Int = 20, impactsAfter: String, projectRef: ID!): ProjectCandidateCheckpoint

  """
  Page Candidate checkpoints submitted by any Repository member of the exact Project scope.
  """
  projectCandidateCheckpoints(after: String, changeSetId: ID, checkpointKind: CandidateCheckpointKind, first: Int = 20, projectRef: ID!, sort: DeliverySort = NEWEST_FIRST): CandidateCheckpointConnection

  """
  Resolve one ChangeSet only when it belongs to the exact Project scope.
  """
  projectChangeSet(changeSetId: ID!, projectRef: ID!): CoordinationChangeSet

  """
  Page current ChangeSets whose WorkItems belong to the exact Project scope.
  """
  projectChangeSets(after: String, first: Int = 20, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, status: CoordinationChangeSetStatus): CoordinationChangeSetConnection

  """
  One Decision associated with the exact Project scope.
  """
  projectDecision(decisionId: ID!, projectRef: ID!): ProjectDecision

  """
  One AgentChoice impact assessment associated with the exact Project scope.
  """
  projectDecisionImpact(assessmentId: ID!, projectRef: ID!): ProjectAgentChoiceImpact

  """
  Page AgentChoice impact assessments associated with the exact Project scope.
  """
  projectDecisionImpacts(after: String, first: Int = 20, outcome: AgentChoiceImpactOutcome, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST): AgentChoiceImpactConnection

  """
  Page Decisions associated with any Repository member of the exact Project scope.
  """
  projectDecisions(after: String, first: Int = 20, policyStatus: DecisionPolicyStatus, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, topicId: String): GovernanceDecisionConnection

  """
  Page current WorkItem dependencies touching the exact Project scope.
  """
  projectDependencies(after: String, blocking: Boolean, first: Int = 20, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST): CoordinationDependencyConnection

  """
  Resolve one dependency only when a producer or consumer belongs to the Project.
  """
  projectDependency(dependencyId: ID!, projectRef: ID!): CoordinationDependency

  """
  One project-scoped guidance fact and its bounded interpretation proposals.
  """
  projectGuidance(interpretationsAfter: String, interpretationsFirst: Int = 20, messageId: ID!, projectRef: ID!): ProjectGuidanceDetail

  """
  Page Guidance associated with any Repository member of the exact Project scope.
  """
  projectGuidanceMessages(after: String, first: Int = 20, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST, source: GuidanceSource): GuidanceConnection

  """
  One project merge snapshot with candidates and bounded authorization decisions.
  """
  projectMergeSnapshot(authorizationsAfter: String, authorizationsFirst: Int = 20, mergeSnapshotId: ID!, projectRef: ID!): ProjectMergeSnapshot

  """
  Page merge snapshots produced by any Repository member of the exact Project scope.
  """
  projectMergeSnapshots(after: String, first: Int = 20, projectRef: ID!, sort: DeliverySort = NEWEST_FIRST): MergeSnapshotConnection

  """
  One ReleaseSet whose persisted ordered members include the exact project.
  """
  projectReleaseSet(projectRef: ID!, releaseSetId: ID!): ProjectReleaseSet

  """
  Page ReleaseSets with at least one ordered member in the exact Project scope.
  """
  projectReleaseSets(after: String, changeSetId: ID, first: Int = 20, projectRef: ID!, sort: DeliverySort = NEWEST_FIRST, status: ReleaseSetStatus): ReleaseSetConnection

  """
  Resolve one Resource only when its Repository belongs to the exact Project scope.
  """
  projectResource(projectRef: ID!, resourceId: ID!): ProjectResource

  """
  Resolve one projected Resource work intention, including withdrawn, terminal, or expired history.
  """
  projectResourceWorkIntention(intentionId: ID!, projectRef: ID!): ResourceWorkIntention

  """
  Page the latest available Resource inventory for the exact Project scope.
  """
  projectResources(after: String, first: Int = 20, path: String, projectRef: ID!, resourceKind: ResourceKind, resourceLifecycleStatus: ResourceLifecycleStatus, sort: LatestUpdateSort = NEWEST_FIRST): ProjectResourceConnection

  """
  Current projected revision of one Skill in the exact Project scope.
  """
  projectSkill(name: String!, projectRef: ID!): ProjectSkill

  """
  Current projected content of one Skill asset in the exact Project scope.
  """
  projectSkillAsset(name: String!, path: String!, projectRef: ID!): ProjectSkillAsset

  """
  Page current Skills shared by the exact Project scope.
  """
  projectSkills(after: String, first: Int = 20, name: String, projectRef: ID!, sort: LatestUpdateSort = NEWEST_FIRST): SkillConnection

  """
  One project-related verification obligation with bounded evidence facts.
  """
  projectVerificationObligation(evidenceAfter: String, evidenceFirst: Int = 20, obligationId: ID!, projectRef: ID!): ProjectVerificationObligation

  """
  Page verification obligations whose source or target belongs to the exact Project scope.
  """
  projectVerificationObligations(after: String, changeSetId: ID, first: Int = 20, projectRef: ID!, sort: DeliverySort = NEWEST_FIRST, status: VerificationObligationStatus): VerificationObligationConnection

  """
  Resolve one project WorkItem with its current or latest Attempt and checkpoint.
  """
  projectWorkItem(projectRef: ID!, workItemId: ID!): CoordinationWorkItemDetail

  """
  Page current WorkItems in the exact Project scope with server-driven filters.
  """
